server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

# Purely to make the "payment declined" path demoable without wiring up a
# real payment processor: any charge above this amount is declined.
payment:
  decline-above-amount: 1000.00
