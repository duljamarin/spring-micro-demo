server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:cartdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            # Must stay above order-orchestrator's own 12.5s saga bound (see
            # order-orchestrator.yml). The old 5s sat *below* it, so a slow
            # but perfectly healthy checkout was abandoned here while the
            # saga kept running - this service reported a failure for an item
            # that went on to be ordered, and left it in the cart to be
            # ordered again on retry.
            read-timeout: 14000

# Sized so that budget + one in-flight item (14s) stays under the gateway's
# cartServiceCB TimeLimiter, which is what makes the worst case bounded:
# the loop can overshoot the budget by at most the one call already running.
cart:
  checkout-budget: 20s
