server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

# Business-tunable config, centrally managed and reloadable via /actuator/refresh
inventory:
  low-stock-threshold: 5
