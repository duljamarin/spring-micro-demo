server:
  port: 8761

spring:
  cloud:
    # Spring Boot 4.1 has no Spring Cloud release train of its own:
    # 2025.1.x is built against Boot 4.0.x and 2026.0.x against Boot
    # 4.2.x, so this check refuses to start on 4.1.x with either train.
    # Disabled because the Boot version is pinned deliberately - see
    # spring-cloud.version in the parent pom for the tradeoff.
    compatibility-verifier:
      enabled: false
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # The registry itself doesn't need to register with or fetch from another registry.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Faster eviction of dead instances for demo purposes (default is 90s).
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
